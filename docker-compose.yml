services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: reportes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      POSTGRES_DB: reportes311
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportes -d reportes311"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://reportes:${DB_PASSWORD}@db:5432/reportes311?schema=public
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://reportes:${DB_PASSWORD}@db:5432/reportes311?schema=public
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
