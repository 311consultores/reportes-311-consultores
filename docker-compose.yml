services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?define DB_ROOT_PASSWORD en .env}
      MARIADB_USER: reportes
      MARIADB_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}
      MARIADB_DATABASE: reportes311
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: mysql://reportes:${DB_PASSWORD}@db:3306/reportes311?connection_limit=5
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://reportes:${DB_PASSWORD}@db:3306/reportes311?connection_limit=5
    ports:
      - "3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  dbdata: